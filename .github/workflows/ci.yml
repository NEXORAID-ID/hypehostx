name: Local-scope verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:dist
      - run: npx tsc -p backend/tsconfig.json
      - run: npx tsx --test backend/tests/integration.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=high
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cmake -S native -B native/build
      - run: cmake --build native/build --config Debug
      - run: ctest --test-dir native/build -C Debug --output-on-failure
